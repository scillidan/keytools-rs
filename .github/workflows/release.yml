name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v6
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Determine version
        id: version
        shell: bash
        run: echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build workspace
        run: cargo build --release --workspace

      - name: Package apps
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          $apps = Get-ChildItem -Directory apps | ForEach-Object Name
          foreach ($app in $apps) {
            $exe = "target/release/$app.exe"
            if (-not (Test-Path $exe)) { throw "missing $exe" }
            Compress-Archive -Path $exe -DestinationPath "dist/$app-$env:TAG-windows-x86_64.zip"
          }

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.zip > checksums-sha256.txt

      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG_NAME" dist/* \
            --title "$TAG_NAME" \
            --generate-notes
